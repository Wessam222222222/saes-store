<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هاكر ون ستيت - الدفع الآمن</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0a1931;
            --secondary: #185adb;
            --accent: #ffc947;
            --dark: #1e2022;
            --light: #f8f9fa;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0a1931 0%, #185adb 100%);
            color: var(--light);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .hacker-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            transition: transform 0.4s ease;
            position: relative;
        }
        
        .hacker-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        
        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .hacker-header {
            padding: 25px;
            text-align: center;
            position: relative;
        }
        
        .hacker-header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 201, 71, 0.3);
        }
        
        .hacker-header p {
            opacity: 0.8;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }
        
        .hacker-badge {
            display: inline-block;
            background: rgba(255, 201, 71, 0.2);
            color: var(--accent);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 10px;
            border: 1px solid rgba(255, 201, 71, 0.3);
        }
        
        .hacker-body {
            padding: 0 25px 25px;
        }
        
        .features-list {
            margin: 20px 0;
            list-style: none;
        }
        
        .features-list li {
            padding: 10px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
        }
        
        .features-list li:last-child {
            border-bottom: none;
        }
        
        .features-list i {
            margin-left: 10px;
            color: var(--accent);
        }
        
        #paypal-container {
            margin: 30px 0;
            min-height: 45px;
        }
        
        .security-info {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        
        .security-info i {
            margin-left: 8px;
            color: var(--accent);
        }
        
        .glow-effect {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,201,71,0.3) 0%, rgba(255,201,71,0) 70%);
            border-radius: 50%;
            top: -50px;
            right: -50px;
            z-index: -1;
        }
        
        .glow-effect-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(24,90,219,0.2) 0%, rgba(24,90,219,0) 70%);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            z-index: -1;
        }
        
        @media (max-width: 480px) {
            .hacker-header h1 {
                font-size: 1.5rem;
            }
            
            .product-image {
                height: 180px;
            }
            
            .hacker-card {
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="hacker-card">
        <div class="glow-effect"></div>
        <div class="glow-effect-2"></div>
        
        <!-- الصورة التي طلبتها -->
        <img src="https://i.ytimg.com/vi/Nc5PdJYoXSY/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBWXFVGwFXudd7RiLsvHSKQ0ScK0w" 
             alt="هاكر ون ستيت" 
             class="product-image">
        
        <div class="hacker-header">
            <h1>هاكر ون ستيت</h1>
            <p>الحل الشامل للحماية والأمن السيبراني</p>
            <span class="hacker-badge">إصدار Premium</span>
        </div>
        
        <div class="hacker-body">
            <ul class="features-list">
                <li><i class="fas fa-shield-alt"></i> <span>حماية متقدمة من الاختراقات</span></li>
                <li><i class="fas fa-bolt"></i> <span>أدوات احترافية للهاكر الأخلاقي</span></li>
                <li><i class="fas fa-lock"></i> <span>تشفير من المستوى العسكري</span></li>
                <li><i class="fas fa-globe"></i> <span>دعم فني على مدار الساعة</span></li>
            </ul>
            
            <div id="paypal-container"></div>
            
            <div class="security-info">
                <i class="fas fa-lock"></i>
                <span>معاملات آمنة عبر PayPal</span>
            </div>
        </div>
    </div>

    <!-- PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAAg1Is85D9IbviBXQZumNbKxpHzB5Dv_pRPmaSjqjGWErYtYtZuMBfeSbMA3ami4SXBSog4qKU87yZmdM&components=hosted-buttons&disable-funding=venmo&currency=USD"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('paypal-container');
            
            // تأثير تحميل أنيق
            container.innerHTML = `
                <div style="text-align:center; padding:15px;">
                    <div style="display:inline-block; background:rgba(255,201,71,0.2); 
                        padding:10px 20px; border-radius:8px; border:1px solid rgba(255,201,71,0.3);">
                        <i class="fas fa-circle-notch fa-spin" style="margin-left:8px; color:#ffc947;"></i>
                        <span>جاري تحميل نظام الدفع الآمن...</span>
                    </div>
                </div>
            `;
            
            // تهيئة زر PayPal
            paypal.HostedButtons({
                hostedButtonId: "2LBQGGU377VJS",
                onInit: function() {
                    console.log('تم تهيئة زر الدفع بنجاح');
                },
                onClick: function() {
                    // يمكنك إضافة أي إجراء قبل الدفع هنا
                },
                onError: function(err) {
                    console.error('خطأ في نظام الدفع:', err);
                    container.innerHTML = `
                        <div style="text-align:center; padding:15px; background:rgba(255,0,0,0.1); 
                            border-radius:8px; border:1px solid rgba(255,0,0,0.3);">
                            <i class="fas fa-exclamation-triangle" style="margin-left:8px;"></i>
                            <span>حدث خطأ في تحميل نظام الدفع، يرجى تحديث الصفحة</span>
                        </div>
                    `;
                }
            }).render("#paypal-container");
        });
    </script>
</body>
</html>
